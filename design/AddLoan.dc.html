<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New loan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
.s{box-sizing:border-box;background:#F6F7F4;color:#16181D;font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.4;position:relative;overflow:hidden}
.s *{box-sizing:border-box}
.s svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.h{font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;letter-spacing:-.01em;margin:0}
.n{font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 12px}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid #E3E5E0;background:#fff;color:#16181D;display:flex;align-items:center;justify-content:center;padding:0}
.seg{display:flex;background:#ECEEE9;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:none;font:500 14px 'IBM Plex Sans',sans-serif;color:#3D424A}
.seg button.on{background:#fff;color:#16181D;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.lb{font-size:13px;font-weight:500;color:#3D424A}
.in{min-height:48px;border-radius:12px;border:1px solid #D5D8D2;background:#fff;padding:0 14px;font:400 15px 'IBM Plex Sans',sans-serif;color:#16181D;width:100%}
.chip{min-height:40px;padding:0 12px 0 6px;border-radius:999px;border:1px solid #D5D8D2;background:#fff;color:#16181D;font:500 14px 'IBM Plex Sans',sans-serif;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:#16181D;border-color:#16181D;color:#fff}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 11px 'Space Grotesk',sans-serif;background:#D9EFEA;color:#0F6E64}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-bottom:1px solid #EEF0EB}
.row:last-child{border-bottom:0}
.sw{width:46px;height:28px;border-radius:99px;background:#C9CDC6;position:relative;border:0;flex:none;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff}
.sw.on{background:#0F6E64}.sw.on::after{left:21px}
.t2{font-size:13px;color:#5B616B;margin:0}
</style>
</helmet>
<div class="s" style="width: 390px; height: 900px;">
  <header class="top">
    <a class="ib" href="Loans.dc.html" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    <h1 class="h" style="font-size: 18px;">New loan</h1>
    <span style="width: 44px;"></span>
  </header>

  <div style="padding: 0 20px 24px; display: flex; flex-direction: column; gap: 16px;">
    <div class="seg" role="group" aria-label="Loan kind">
      <button class="on" type="button">Personal</button>
      <button type="button">Bank / formal</button>
    </div>

    <div class="seg" role="group" aria-label="Direction" style="background: transparent; padding: 0; gap: 8px;">
      <button class="on" type="button" style="border: 1.5px solid #0F6E64; background: #EEF6F4; color: #0F5B47; min-height: 48px; border-radius: 12px;">I lent money</button>
      <button type="button" style="border: 1px solid #D5D8D2; background: #fff; min-height: 48px; border-radius: 12px;">I borrowed</button>
    </div>

    <div class="fld">
      <label for="al-amt">Amount</label>
      <input id="al-amt" class="in n" type="text" inputmode="decimal" value="₱3,500.00" style="font: 700 28px 'Space Grotesk', sans-serif; min-height: 60px;">
    </div>

    <div class="fld">
      <span class="lb">Person</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <button class="chip on" type="button"><span class="av">JD</span>Juan</button>
        <button class="chip" type="button"><span class="av">MS</span>Maria</button>
        <button class="chip" type="button"><span class="av">AL</span>Ana</button>
        <button class="chip" type="button"><span class="av" style="background: #FBE3D3; color: #8A3A10;">KR</span>Ken</button>
        <button class="chip" type="button" style="padding: 0 14px;"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New contact</button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <div class="fld"><label for="al-date">Date</label><input id="al-date" class="in" type="text" value="Oct 8, 2026"></div>
      <div class="fld"><label for="al-due">Due date (optional)</label><input id="al-due" class="in" type="text" placeholder="None"></div>
    </div>

    <div class="fld"><label for="al-note">What's it for?</label><input id="al-note" class="in" type="text" value="Phone repair"></div>

    <div style="background: #fff; border: 1px solid #E3E5E0; border-radius: 16px; padding: 0 16px;">
      <div class="row">
        <div><p style="margin: 0; font-weight: 500;">Take from account</p><p class="t2">GCash · balance updates</p></div>
        <button class="sw on" type="button" role="switch" aria-checked="true" aria-label="Take from account"></button>
      </div>
      <div class="row">
        <div><p style="margin: 0; font-weight: 500;">Remind me</p><p class="t2">1 day before due date</p></div>
        <button class="sw" type="button" role="switch" aria-checked="false" aria-label="Remind me"></button>
      </div>
    </div>

    <button type="button" style="min-height: 52px; border-radius: 14px; border: 0; background: #0F6E64; color: #fff; font: 600 16px 'IBM Plex Sans', sans-serif;">Save loan</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
