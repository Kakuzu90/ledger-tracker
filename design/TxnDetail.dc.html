<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transaction detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
.s{box-sizing:border-box;background:#F6F7F4;color:#16181D;font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.4;position:relative;overflow:hidden}
.s *{box-sizing:border-box}
.s svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.h{font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;letter-spacing:-.01em;margin:0}
.n{font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.neg{color:#B4501A}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 12px}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid #E3E5E0;background:#fff;color:#16181D;display:flex;align-items:center;justify-content:center;padding:0}
.card{background:#fff;border:1px solid #E3E5E0;border-radius:18px;padding:4px 16px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:50px;border-bottom:1px solid #EEF0EB}
.kv:last-child{border-bottom:0}
.kv dt{color:#5B616B;font-size:14px}
.kv dd{margin:0;font-weight:500;text-align:right}
.tag{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:99px;background:#ECEEE9;font-size:13px;font-weight:500;color:#3D424A}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:72px;justify-content:center;border:1px solid #E3E5E0;background:#fff;border-radius:14px;font:500 13px 'IBM Plex Sans',sans-serif;color:#16181D;text-decoration:none}
</style>
</helmet>
<div class="s" style="width: 390px; height: 844px;">
  <header class="top">
    <a class="ib" href="Activity.dc.html" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <h1 class="h" style="font-size: 18px;">Transaction</h1>
    <button class="ib" type="button" aria-label="Edit"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
  </header>

  <div style="padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 14px;">
    <div style="text-align: center; padding: 8px 0 4px;">
      <div style="width: 56px; height: 56px; border-radius: 16px; background: #FBE3D3; color: #8A3A10; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font: 600 18px 'Space Grotesk', sans-serif;">Gr</div>
      <p class="n neg" style="margin: 0; font-size: 36px; font-weight: 700;">−₱2,145.00</p>
      <p style="margin: 2px 0 0; font-weight: 500;">SM Supermarket</p>
    </div>

    <dl class="card" style="margin: 0;">
      <div class="kv"><dt>Category</dt><dd>Food › Groceries</dd></div>
      <div class="kv"><dt>Account</dt><dd>Cash</dd></div>
      <div class="kv"><dt>Date</dt><dd>Oct 13, 2026 · 6:12 PM</dd></div>
      <div class="kv"><dt>Tags</dt><dd style="display: flex; gap: 6px;"><span class="tag">#household</span><span class="tag">#weekly</span></dd></div>
      <div class="kv"><dt>Repeats</dt><dd>Never</dd></div>
      <div class="kv" style="align-items: flex-start; padding: 14px 0;"><dt>Note</dt><dd style="max-width: 220px; font-weight: 400;">Stocked up for the week, includes cleaning supplies</dd></div>
    </dl>

    <div class="card" style="padding: 12px; display: flex; gap: 12px; align-items: center;">
      <div aria-hidden="true" style="width: 64px; height: 80px; border-radius: 10px; background: repeating-linear-gradient(135deg, #ECEEE9 0 6px, #F6F7F4 6px 12px); border: 1px solid #E3E5E0; flex: none;"></div>
      <div style="flex: 1; min-width: 0;">
        <p style="margin: 0; font-weight: 500;">Receipt photo</p>
        <p style="margin: 0; font-size: 13px; color: #5B616B;">Stored on device · 182 KB</p>
      </div>
      <button class="ib" type="button" aria-label="Replace receipt"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"></rect><circle cx="12" cy="13" r="3.5"></circle><path d="M9 6l1.5-2h3L15 6"></path></svg></button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <button class="act" type="button"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"></path></svg>Duplicate</button>
      <a class="act" href="Split.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"></path></svg>Split</a>
      <button class="act" type="button"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4"></path></svg>Make recurring</button>
    </div>

    <button type="button" style="min-height: 50px; border-radius: 14px; border: 1px solid #F1D8C8; background: #FDF7F3; color: #8A3A10; font: 600 15px 'IBM Plex Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px;"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>Delete transaction</button>
  </div>
</div>
</x-dc>

</html>
